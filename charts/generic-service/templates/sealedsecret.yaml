{{- range $name, $ss := .Values.sealedSecrets }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "generic-service.labels" $ | nindent 4 }}
spec:
  {{- with $ss.template }}
  # 模板直通：可指定 type/metadata 等（如 kubernetes.io/dockerconfigjson）
  template:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  encryptedData:
    {{- toYaml $ss.encryptedData | nindent 4 }}
---
{{- end }}
